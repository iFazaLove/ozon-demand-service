services:
  python:
    build:
      context: .
      dockerfile: infra/python/Dockerfile
      target: runtime

  checks:
    profiles: [dev]
    build:
      context: .
      dockerfile: infra/python/Dockerfile
      target: checks

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.2-full
    profiles: [dev]
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --workers=1
      - --allowed-hosts=localhost:*,127.0.0.1:*,mlflow:5000
      - --backend-store-uri=sqlite:////mlflow-data/mlflow.db
      - --serve-artifacts
      - --artifacts-destination=/mlflow-data/artifacts
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-data:/mlflow-data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/health', timeout=3).close()"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

volumes:
  mlflow-data:
